name: Release Please

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR that accumulates every conventional commit since
      # the last release and keeps CHANGELOG.md + the three version files
      # (package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json) in sync.
      # Merge the PR to cut a release; CI gates run on that PR, not on commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
