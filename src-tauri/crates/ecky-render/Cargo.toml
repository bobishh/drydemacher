[package]
name = "ecky-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-neutral render and geometry-kernel contracts for Ecky"

[features]
default = []
workspace-fixtures = []

[dependencies]
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
steel_core = { package = "steel-core", version = "0.8.2" }
