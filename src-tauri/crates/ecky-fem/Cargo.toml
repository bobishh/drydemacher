[package]
name = "ecky-fem"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Backend-neutral FEM domain contracts for Ecky"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg", "rayon"] }
rayon = "1.11"

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
ecky-accelerate-sparse = { path = "../ecky-accelerate-sparse" }
